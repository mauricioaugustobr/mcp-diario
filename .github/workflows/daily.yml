name: Coleta diária de MCPs
on:
  schedule: [{ cron: "50 2 * * *" }]   # 23:50 em São Paulo (UTC-3)
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run fetch
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          git config user.name "mcp-diario-bot"; git config user.email "bot@users.noreply.github.com"
          git add data && git commit -m "dados: $(TZ=America/Sao_Paulo date +%F)" || echo "sem mudanças"
          git push
